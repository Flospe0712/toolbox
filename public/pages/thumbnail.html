<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Thumbnail Creator</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@700&family=Montserrat:wght@700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 2rem;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 2rem;
      font-size: 2rem;
    }

    .editor-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      margin-bottom: 3rem;
    }

    .controls {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 0.75rem;
      padding: 2rem;
    }

    .control-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #f1f5f9;
    }

    input[type="text"],
    select {
      width: 100%;
      padding: 0.75rem;
      background: #334155;
      border: 1px solid #475569;
      color: #e2e8f0;
      border-radius: 0.375rem;
      font-size: 1rem;
    }

    input[type="text"]:focus,
    select:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .color-palette {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.75rem;
    }

    .color-option {
      padding: 0.75rem;
      border: 2px solid #475569;
      border-radius: 0.375rem;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      font-size: 0.875rem;
      font-weight: 600;
    }

    .color-option:hover {
      border-color: #3b82f6;
    }

    .color-option.active {
      border-color: #3b82f6;
      background: #334155;
    }

    .dark-colors {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      color: #fff;
    }

    .neon-colors {
      background: linear-gradient(135deg, #ff006e, #ffbe0b);
      color: #000;
    }

    .pastel-colors {
      background: linear-gradient(135deg, #ffd6a5, #caffbf);
      color: #000;
    }

    .auto-colors {
      background: linear-gradient(135deg, #a8dadc, #457b9d);
      color: #fff;
    }

    .generate-btn {
      width: 100%;
      padding: 1rem;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 0.375rem;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 1rem;
    }

    .generate-btn:hover {
      background: #2563eb;
    }

    .generate-btn:active {
      transform: scale(0.98);
    }

    .preview-section {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 400px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 0.75rem;
      padding: 1rem;
    }

    .preview-canvas {
      max-width: 100%;
      max-height: 100%;
      border-radius: 0.375rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .previews-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 2rem;
      margin-top: 2rem;
    }

    .preview-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 0.75rem;
      overflow: hidden;
    }

    .preview-card-title {
      padding: 1rem;
      border-bottom: 1px solid #334155;
      font-weight: 600;
      color: #f1f5f9;
    }

    .preview-card-image {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .preview-card-image canvas {
      max-width: 100%;
      max-height: 100%;
    }

    .download-btn {
      width: 100%;
      padding: 0.75rem;
      margin: 1rem;
      background: #10b981;
      color: #fff;
      border: none;
      border-radius: 0.375rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .download-btn:hover {
      background: #059669;
    }

    @media (max-width: 1024px) {
      .editor-section {
        grid-template-columns: 1fr;
      }
      .previews-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎬 YouTube Thumbnail Creator</h1>

    <div class="editor-section">
      <div class="controls">
        <div class="control-group">
          <label>Video Titel / Thema</label>
          <input type="text" id="titleInput" placeholder="z.B. AI Productivity Hacks" value="Amazing Content">
        </div>

        <div class="control-group">
          <label>Template</label>
          <select id="templateSelect">
            <option value="bold-text">Bold Text</option>
            <option value="text-icon">Text + Icon</option>
            <option value="minimalist">Minimalist</option>
            <option value="split">Split Design</option>
            <option value="headlines">Headlines</option>
          </select>
        </div>

        <div class="control-group">
          <label>Farbschema</label>
          <div class="color-palette">
            <div class="color-option dark-colors active" data-scheme="dark">Dark</div>
            <div class="color-option neon-colors" data-scheme="neon">Neon</div>
            <div class="color-option pastel-colors" data-scheme="pastel">Pastel</div>
            <div class="color-option auto-colors" data-scheme="auto">Auto</div>
          </div>
        </div>

        <button class="generate-btn" onclick="generateThumbnails()">⚡ Generieren</button>
      </div>

      <div class="preview-section">
        <canvas id="previewCanvas" class="preview-canvas" width="1280" height="720"></canvas>
      </div>
    </div>

    <div class="previews-grid" id="previewsGrid"></div>
  </div>

  <script src="../js/thumbnail-editor.js"></script>
</body>
</html>
