<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube SEO Optimizer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 2rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 2rem;
      font-size: 2rem;
    }

    .input-section {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    input[type="text"] {
      padding: 1rem;
      background: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      border-radius: 0.375rem;
      font-size: 1rem;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .optimize-btn {
      padding: 1rem 2rem;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 0.375rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .optimize-btn:hover {
      background: #2563eb;
    }

    .optimize-btn:disabled {
      background: #6b7280;
      cursor: not-allowed;
    }

    .loading {
      text-align: center;
      padding: 2rem;
      display: none;
    }

    .loading.active {
      display: block;
    }

    .spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 4px solid #334155;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .results {
      display: none;
    }

    .results.active {
      display: block;
    }

    .result-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 0.75rem;
      padding: 2rem;
      margin-bottom: 2rem;
    }

    .result-card h2 {
      font-size: 1.25rem;
      margin-bottom: 1rem;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .score {
      display: inline-block;
      background: #10b981;
      color: #fff;
      padding: 0.25rem 0.75rem;
      border-radius: 0.25rem;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .score.medium {
      background: #f59e0b;
    }

    .score.low {
      background: #ef4444;
    }

    .items-list {
      display: grid;
      gap: 1rem;
    }

    .item {
      background: #0f172a;
      padding: 1rem;
      border-radius: 0.375rem;
      border-left: 3px solid #3b82f6;
    }

    .item-title {
      font-weight: 600;
      color: #f1f5f9;
      margin-bottom: 0.5rem;
      word-break: break-word;
    }

    .item-meta {
      font-size: 0.875rem;
      color: #94a3b8;
      margin-top: 0.5rem;
    }

    .item-text {
      color: #cbd5e1;
      margin-bottom: 0.5rem;
      line-height: 1.5;
    }

    .copy-btn {
      background: #10b981;
      color: #fff;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 0.375rem;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.875rem;
      transition: all 0.2s;
      margin-top: 0.5rem;
    }

    .copy-btn:hover {
      background: #059669;
    }

    .analysis-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .analysis-stat {
      background: #334155;
      padding: 1.5rem;
      border-radius: 0.375rem;
      text-align: center;
    }

    .stat-number {
      font-size: 2rem;
      font-weight: 700;
      color: #3b82f6;
    }

    .stat-label {
      font-size: 0.875rem;
      color: #94a3b8;
      margin-top: 0.5rem;
    }

    @media (max-width: 768px) {
      .input-section {
        grid-template-columns: 1fr;
      }
      .analysis-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 YouTube SEO Optimizer</h1>

    <div class="input-section">
      <input type="text" id="topicInput" placeholder="Video-Thema eingeben (z.B. 'AI Productivity Hacks')" value="AI Productivity">
      <button class="optimize-btn" id="optimizeBtn" onclick="optimizeForSEO()">⚡ Analysieren</button>
    </div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p style="margin-top: 1rem; color: #94a3b8;">Analysiere Top-Videos und erstelle Optimierungen...</p>
    </div>

    <div class="results" id="results">
      <div class="analysis-grid">
        <div class="analysis-stat">
          <div class="stat-number" id="competitionScore">8.2</div>
          <div class="stat-label">SEO Score</div>
        </div>
        <div class="analysis-stat">
          <div class="stat-number" id="volumeScore">245K</div>
          <div class="stat-label">Monatliches Suchvolumen</div>
        </div>
        <div class="analysis-stat">
          <div class="stat-number" id="difficultyScore">6.5</div>
          <div class="stat-label">Schwierigkeit</div>
        </div>
        <div class="analysis-stat">
          <div class="stat-number" id="trendScore">📈</div>
          <div class="stat-label">Trend</div>
        </div>
      </div>

      <div class="result-card">
        <h2>
          🎬 Titel-Vorschläge
          <span class="score">10/10</span>
        </h2>
        <div class="items-list" id="titlesResults"></div>
      </div>

      <div class="result-card">
        <h2>
          📌 30 SEO Tags
          <span class="score">9/10</span>
        </h2>
        <div id="tagsResults" style="background: #0f172a; padding: 1rem; border-radius: 0.375rem; color: #cbd5e1; line-height: 1.8;"></div>
        <button class="copy-btn" onclick="copyContent('tagsResults')" style="margin-top: 1rem;">📋 Kopieren</button>
      </div>

      <div class="result-card">
        <h2>
          📝 Beschreibungs-Template
          <span class="score">9/10</span>
        </h2>
        <div id="descriptionResults" style="background: #0f172a; padding: 1rem; border-radius: 0.375rem; color: #cbd5e1; line-height: 1.8; max-height: 400px; overflow-y: auto;"></div>
        <button class="copy-btn" onclick="copyContent('descriptionResults')" style="margin-top: 1rem;">📋 Kopieren</button>
      </div>

      <div class="result-card">
        <h2>
          #️⃣ Hashtags (Instagram/TikTok)
          <span class="score">8/10</span>
        </h2>
        <div id="hashtagsResults" style="background: #0f172a; padding: 1rem; border-radius: 0.375rem; color: #cbd5e1; line-height: 1.8;"></div>
        <button class="copy-btn" onclick="copyContent('hashtagsResults')" style="margin-top: 1rem;">📋 Kopieren</button>
      </div>

      <div class="result-card">
        <h2>💡 SEO Tipps</h2>
        <div class="items-list" id="tipsResults"></div>
      </div>
    </div>
  </div>

  <script src="../js/seo-optimizer.js"></script>
</body>
</html>
