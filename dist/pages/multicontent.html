<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Content Generator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 2rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 2rem;
      font-size: 2rem;
    }

    .input-section {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 0.75rem;
      padding: 2rem;
      margin-bottom: 2rem;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: #f1f5f9;
    }

    textarea {
      width: 100%;
      padding: 1rem;
      background: #0f172a;
      border: 1px solid #334155;
      color: #e2e8f0;
      border-radius: 0.375rem;
      font-size: 0.95rem;
      line-height: 1.5;
      min-height: 150px;
      font-family: monospace;
      resize: vertical;
    }

    textarea:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .button-group {
      display: flex;
      gap: 1rem;
      margin-top: 1rem;
    }

    .generate-btn {
      padding: 1rem 2rem;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 0.375rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .generate-btn:hover {
      background: #2563eb;
    }

    .clear-btn {
      padding: 1rem 2rem;
      background: #6b7280;
      color: #fff;
      border: none;
      border-radius: 0.375rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .clear-btn:hover {
      background: #4b5563;
    }

    .tabs {
      display: flex;
      gap: 0.5rem;
      border-bottom: 1px solid #334155;
      margin-bottom: 2rem;
      overflow-x: auto;
    }

    .tab-btn {
      padding: 1rem 1.5rem;
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
      white-space: nowrap;
      font-weight: 500;
    }

    .tab-btn:hover {
      color: #e2e8f0;
    }

    .tab-btn.active {
      color: #3b82f6;
      border-bottom-color: #3b82f6;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .content-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 0.75rem;
      padding: 2rem;
      margin-bottom: 2rem;
    }

    .content-card h3 {
      margin-bottom: 1rem;
      color: #f1f5f9;
      font-size: 1.125rem;
    }

    .content-text {
      background: #0f172a;
      padding: 1.5rem;
      border-radius: 0.375rem;
      color: #cbd5e1;
      line-height: 1.7;
      max-height: 500px;
      overflow-y: auto;
      margin-bottom: 1rem;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .copy-btn {
      background: #10b981;
      color: #fff;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 0.375rem;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .copy-btn:hover {
      background: #059669;
    }

    .copy-btn.copied {
      background: #6366f1;
    }

    .results-section {
      display: none;
    }

    .results-section.active {
      display: block;
    }

    .loading {
      text-align: center;
      padding: 2rem;
      display: none;
    }

    .loading.active {
      display: block;
    }

    .spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 4px solid #334155;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 768px) {
      .button-group {
        flex-direction: column;
      }
      .tabs {
        gap: 0;
      }
      .tab-btn {
        padding: 0.75rem 1rem;
        font-size: 0.875rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📢 Multi-Content Generator</h1>

    <div class="input-section">
      <label>📝 Podcast-Transkript oder Artikel-Text</label>
      <textarea id="transcriptInput" placeholder="Füge dein Podcast-Transkript oder Artikel-Text hier ein...

Beispiel:
In dieser Episode sprechen wir über AI und ihre Auswirkungen...

Der Generator erstellt automatisch:
- Blog-Artikel
- Newsletter-Text
- Twitter Threads
- LinkedIn Posts
- Instagram Captions
- TikTok Scripts
- Social-Media-Zitate"></textarea>
      <div class="button-group">
        <button class="generate-btn" onclick="generateAllContent()">⚡ Alle Content-Formate generieren</button>
        <button class="clear-btn" onclick="clearAll()">🗑️ Löschen</button>
      </div>
    </div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p style="margin-top: 1rem; color: #94a3b8;">Generiere Content für alle Plattformen...</p>
    </div>

    <div class="results-section" id="resultsSection">
      <div class="tabs">
        <button class="tab-btn active" data-tab="blog" onclick="switchTab(event)">📖 Blog</button>
        <button class="tab-btn" data-tab="newsletter" onclick="switchTab(event)">📧 Newsletter</button>
        <button class="tab-btn" data-tab="twitter" onclick="switchTab(event)">𝕏 Twitter</button>
        <button class="tab-btn" data-tab="linkedin" onclick="switchTab(event)">💼 LinkedIn</button>
        <button class="tab-btn" data-tab="instagram" onclick="switchTab(event)">📸 Instagram</button>
        <button class="tab-btn" data-tab="tiktok" onclick="switchTab(event)">🎵 TikTok</button>
        <button class="tab-btn" data-tab="quotes" onclick="switchTab(event)">💭 Zitate</button>
      </div>

      <!-- Blog -->
      <div class="tab-content active" id="blog" data-tab="blog">
        <div class="content-card">
          <h3>📖 Blog-Artikel (1000-2000 Wörter)</h3>
          <div class="content-text" id="blogContent"></div>
          <button class="copy-btn" onclick="copyContent('blogContent')">📋 Kopieren</button>
        </div>
      </div>

      <!-- Newsletter -->
      <div class="tab-content" id="newsletter" data-tab="newsletter">
        <div class="content-card">
          <h3>📧 Newsletter-Text</h3>
          <div class="content-text" id="newsletterContent"></div>
          <button class="copy-btn" onclick="copyContent('newsletterContent')">📋 Kopieren</button>
        </div>
      </div>

      <!-- Twitter -->
      <div class="tab-content" id="twitter" data-tab="twitter">
        <div class="content-card">
          <h3>𝕏 Twitter Threads</h3>
          <div class="content-text" id="twitterContent"></div>
          <button class="copy-btn" onclick="copyContent('twitterContent')">📋 Kopieren</button>
        </div>
      </div>

      <!-- LinkedIn -->
      <div class="tab-content" id="linkedin" data-tab="linkedin">
        <div class="content-card">
          <h3>💼 LinkedIn Post</h3>
          <div class="content-text" id="linkedinContent"></div>
          <button class="copy-btn" onclick="copyContent('linkedinContent')">📋 Kopieren</button>
        </div>
      </div>

      <!-- Instagram -->
      <div class="tab-content" id="instagram" data-tab="instagram">
        <div class="content-card">
          <h3>📸 Instagram Carousel (10 Slides)</h3>
          <div class="content-text" id="instagramContent"></div>
          <button class="copy-btn" onclick="copyContent('instagramContent')">📋 Kopieren</button>
        </div>
      </div>

      <!-- TikTok -->
      <div class="tab-content" id="tiktok" data-tab="tiktok">
        <div class="content-card">
          <h3>🎵 TikTok Script (60 Sekunden)</h3>
          <div class="content-text" id="tiktokContent"></div>
          <button class="copy-btn" onclick="copyContent('tiktokContent')">📋 Kopieren</button>
        </div>
      </div>

      <!-- Quotes -->
      <div class="tab-content" id="quotes" data-tab="quotes">
        <div class="content-card">
          <h3>💭 Social Media Zitate</h3>
          <div class="content-text" id="quotesContent"></div>
          <button class="copy-btn" onclick="copyContent('quotesContent')">📋 Kopieren</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/multicontent-generator.js"></script>
</body>
</html>
